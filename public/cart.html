<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shopping Cart — CodeAlpha Store</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <div id="site-header-root"></div>

    <main>
      <section class="page-banner">
        <div class="container">
          <h1>Shopping Cart</h1>
          <p>Review your items, adjust quantities, and proceed to checkout.</p>
        </div>
      </section>

      <section class="section">
        <div class="container">
          <div id="cart-error-box" class="alert alert-error" style="display:none;"></div>
          <div id="cart-root">
            <div class="loading-state">
              <div class="spinner"></div>
              <span>Loading your shopping cart...</span>
            </div>
          </div>
        </div>
      </section>
    </main>

    <div id="site-footer-root"></div>

    <script src="/js/api.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/cart.js"></script>
  </body>
</html>
