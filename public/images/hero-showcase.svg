<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" fill="none">
  <defs>
    <radialGradient id="glow1" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="18" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>
  <circle cx="310" cy="230" r="210" fill="url(#glow1)"/>
  <!-- Main Showcase Card -->
  <g filter="url(#drop)">
    <rect x="85" y="45" width="420" height="340" rx="28" fill="url(#cardBg)" stroke="#334155" stroke-width="1.5"/>
    <!-- Studio Headphones Artwork -->
    <path d="M205 210 C205 125, 385 125, 385 210" stroke="#94A3B8" stroke-width="18" stroke-linecap="round"/>
    <path d="M235 138 C275 123, 315 123, 355 138" stroke="#6366F1" stroke-width="8" stroke-linecap="round"/>
    <rect x="184" y="205" width="38" height="72" rx="18" fill="url(#accentGrad)"/>
    <rect x="368" y="205" width="38" height="72" rx="18" fill="url(#accentGrad)"/>
    <rect x="200" y="212" width="16" height="58" rx="8" fill="#0F172A"/>
    <rect x="374" y="212" width="16" height="58" rx="8" fill="#0F172A"/>
    <!-- Product Tag Inside Card -->
    <rect x="115" y="310" width="360" height="52" rx="14" fill="#020617" fill-opacity="0.55" stroke="#334155"/>
    <text x="135" y="333" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="14" font-weight="700">AeroPulse Studio ANC</text>
    <text x="135" y="350" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">42h Battery · Bluetooth 5.3 · In Stock</text>
    <rect x="386" y="321" width="76" height="30" rx="8" fill="#6366F1"/>
    <text x="424" y="341" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="700">&#8377;7,999</text>
  </g>
  <!-- Floating Rating Pill -->
  <g filter="url(#drop)">
    <rect x="34" y="96" width="150" height="56" rx="16" fill="#FFFFFF"/>
    <circle cx="62" cy="124" r="14" fill="#EEF2FF"/>
    <text x="62" y="129" text-anchor="middle" fill="#4F46E5" font-family="system-ui, sans-serif" font-size="14" font-weight="800">★</text>
    <text x="86" y="120" fill="#0F172A" font-family="system-ui, sans-serif" font-size="13" font-weight="700">4.9 / 5.0</text>
    <text x="86" y="137" fill="#64748B" font-family="system-ui, sans-serif" font-size="11">Verified Buyers</text>
  </g>
  <!-- Floating Free Shipping Pill -->
  <g filter="url(#drop)">
    <rect x="414" y="254" width="160" height="56" rx="16" fill="#FFFFFF"/>
    <circle cx="442" cy="282" r="14" fill="#ECFDF5"/>
    <text x="442" y="287" text-anchor="middle" fill="#059669" font-family="system-ui, sans-serif" font-size="13" font-weight="800">✓</text>
    <text x="466" y="278" fill="#0F172A" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Free Express</text>
    <text x="466" y="295" fill="#64748B" font-family="system-ui, sans-serif" font-size="11">Orders over &#8377;999</text>
  </g>
</svg>
