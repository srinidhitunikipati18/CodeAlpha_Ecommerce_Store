<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" fill="none">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </radialGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="480" height="360" rx="20" fill="url(#bg)"/>
  <ellipse cx="240" cy="272" rx="145" ry="14" fill="#64748B" opacity="0.24"/>
  <g filter="url(#shadow)">
    <!-- Temple Arms -->
    <path d="M78 148 L128 118" stroke="#D97706" stroke-width="7" stroke-linecap="round"/>
    <path d="M402 148 L352 118" stroke="#D97706" stroke-width="7" stroke-linecap="round"/>
    <!-- Top Brow Bar & Bridge -->
    <path d="M84 146 L396 146" stroke="#B45309" stroke-width="6" stroke-linecap="round"/>
    <path d="M214 162 C226 152, 254 152, 266 162" stroke="#D97706" stroke-width="6" stroke-linecap="round"/>
    <!-- Left Lens -->
    <path d="M82 150 C82 142, 214 142, 214 164 C214 218, 178 242, 134 242 C96 242, 82 204, 82 150 Z" fill="url(#lens)" stroke="#1C1917" stroke-width="8"/>
    <!-- Right Lens -->
    <path d="M398 150 C398 142, 266 142, 266 164 C266 218, 302 242, 346 242 C384 242, 398 204, 398 150 Z" fill="url(#lens)" stroke="#1C1917" stroke-width="8"/>
    <!-- Specular Highlights -->
    <path d="M104 164 L132 164 L104 202 Z" fill="#FFFFFF" opacity="0.22"/>
    <path d="M286 164 L314 164 L286 202 Z" fill="#FFFFFF" opacity="0.22"/>
  </g>
</svg>
