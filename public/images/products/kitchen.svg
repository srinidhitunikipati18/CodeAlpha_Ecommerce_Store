    <rect x="128" y="274" width="224" height="22" rx="11" fill="#1E293B"/>
    <!-- Jar / Bowl -->
    <path d="M168 144 L312 144 L294 274 L186 274 Z" fill="#E2E8F0" stroke="#94A3B8" stroke-width="3"/>
    <rect x="176" y="132" width="128" height="14" rx="7" fill="#0F172A"/>
