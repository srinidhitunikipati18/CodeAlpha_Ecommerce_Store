      <stop offset="0%" stop-color="#FFF7ED"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </radialGradient>
    <linearGradient id="mixer" x1="150" y1="80" x2="330" y2="290" gradientUnits="userSpaceOnUse">
