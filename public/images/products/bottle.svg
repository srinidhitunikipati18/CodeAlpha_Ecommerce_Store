<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" fill="none">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#ECFEFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </radialGradient>
    <linearGradient id="flask" x1="185" y1="80" x2="295" y2="290" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="60%" stop-color="#0369A1"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="480" height="360" rx="20" fill="url(#bg)"/>
  <ellipse cx="240" cy="312" rx="68" ry="12" fill="#64748B" opacity="0.25"/>
  <g filter="url(#shadow)">
    <!-- Loop Cap -->
    <circle cx="240" cy="54" r="16" stroke="#1E293B" stroke-width="8"/>
    <rect x="206" y="66" width="68" height="28" rx="8" fill="#0F172A"/>
    <!-- Neck -->
    <rect x="212" y="92" width="56" height="14" fill="#CBD5E1"/>
    <!-- Body -->
    <path d="M192 126 C192 108, 212 104, 240 104 C268 104, 288 108, 288 126 L288 286 C288 298, 276 304, 240 304 C204 304, 192 298, 192 286 Z" fill="url(#flask)"/>
    <!-- Specular Shine -->
    <rect x="206" y="130" width="12" height="152" rx="6" fill="#FFFFFF" opacity="0.18"/>
    <!-- Band -->
    <rect x="192" y="220" width="96" height="28" fill="#0F172A" opacity="0.3"/>
    <text x="240" y="239" text-anchor="middle" fill="#E0F2FE" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">HYDROCORE</text>
  </g>
</svg>
