<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" fill="none">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#FFF7ED"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </radialGradient>
    <linearGradient id="kettle" x1="170" y1="90" x2="310" y2="270" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="480" height="360" rx="20" fill="url(#bg)"/>
  <ellipse cx="240" cy="306" rx="125" ry="14" fill="#64748B" opacity="0.25"/>
  <g filter="url(#shadow)">
    <!-- Digital Base -->
    <rect x="134" y="268" width="212" height="24" rx="8" fill="#1E293B"/>
    <circle cx="290" cy="280" r="7" fill="#475569" stroke="#F59E0B" stroke-width="2"/>
    <text x="190" y="284" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">93°C</text>
    <!-- Gooseneck Spout -->
    <path d="M180 236 C120 230, 128 134, 92 108" stroke="#1E293B" stroke-width="14" stroke-linecap="round"/>
    <!-- Handle -->
    <path d="M298 138 C354 138, 358 232, 304 236" stroke="#334155" stroke-width="16" stroke-linecap="round"/>
    <!-- Kettle Body -->
    <path d="M174 114 L304 114 L318 264 L160 264 Z" fill="url(#kettle)"/>
    <!-- Lid & Walnut Knob -->
    <rect x="170" y="102" width="138" height="14" rx="7" fill="#334155"/>
    <rect x="224" y="84" width="30" height="20" rx="7" fill="#92400E"/>
  </g>
</svg>
