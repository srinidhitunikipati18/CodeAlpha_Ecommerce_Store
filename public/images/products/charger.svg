<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" fill="none">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#ECFEFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </radialGradient>
    <linearGradient id="body" x1="150" y1="80" x2="330" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="480" height="360" rx="20" fill="url(#bg)"/>
  <ellipse cx="240" cy="298" rx="90" ry="14" fill="#64748B" opacity="0.24"/>
  <g filter="url(#shadow)">
    <!-- Prongs -->
    <rect x="206" y="64" width="12" height="36" rx="4" fill="#CBD5E1"/>
    <rect x="262" y="64" width="12" height="36" rx="4" fill="#CBD5E1"/>
    <!-- Main GaN Block -->
    <rect x="158" y="92" width="164" height="190" rx="26" fill="url(#body)"/>
    <rect x="166" y="100" width="148" height="174" rx="20" stroke="#475569" stroke-width="1.5" opacity="0.6"/>
    <!-- USB-C Ports -->
    <rect x="205" y="142" width="70" height="18" rx="9" fill="#020617" stroke="#38BDF8" stroke-width="2"/>
    <rect x="218" y="149" width="44" height="4" rx="2" fill="#38BDF8"/>
    <rect x="205" y="176" width="70" height="18" rx="9" fill="#020617" stroke="#64748B" stroke-width="1.5"/>
    <rect x="218" y="183" width="44" height="4" rx="2" fill="#94A3B8"/>
    <!-- USB-A Port -->
    <rect x="200" y="212" width="80" height="22" rx="5" fill="#020617" stroke="#475569" stroke-width="1.5"/>
    <rect x="208" y="218" width="64" height="7" rx="2" fill="#6366F1"/>
    <!-- Power LED & GaN Mark -->
    <circle cx="240" cy="118" r="4" fill="#22D3EE"/>
    <text x="240" y="262" text-anchor="middle" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="2">65W GaN</text>
  </g>
</svg>
