<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" fill="none">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#FEFCE8"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </radialGradient>
    <linearGradient id="cover" x1="150" y1="60" x2="330" y2="290" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="480" height="360" rx="20" fill="url(#bg)"/>
  <ellipse cx="240" cy="306" rx="105" ry="13" fill="#64748B" opacity="0.24"/>
  <g filter="url(#shadow)">
    <!-- Pages Edge -->
    <rect x="148" y="66" width="194" height="224" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
    <!-- Hardcover -->
    <rect x="138" y="58" width="192" height="224" rx="12" fill="url(#cover)"/>
    <!-- Spine -->
    <rect x="138" y="58" width="22" height="224" rx="6" fill="#312E81"/>
    <!-- Gold Foil Title Block -->
    <rect x="182" y="96" width="122" height="68" rx="8" fill="#FFFFFF" fill-opacity="0.12" stroke="#FBBF24" stroke-width="1.5"/>
    <rect x="196" y="114" width="94" height="10" rx="5" fill="#FDE68A"/>
    <rect x="208" y="134" width="70" height="7" rx="3.5" fill="#C7D2FE"/>
    <!-- Bookmark Ribbon -->
    <path d="M276 282 L276 312 L286 302 L296 312 L296 282 Z" fill="#F59E0B"/>
  </g>
</svg>
