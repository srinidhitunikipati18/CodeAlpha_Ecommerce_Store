    <!-- Ventilation Cutout -->
    <rect x="180" y="128" width="120" height="70" rx="12" transform="rotate(-8 240 163)" fill="#F1F5F9" opacity="0.75"/>
    <!-- Silicone Pads -->
    <rect x="148" y="120" width="26" height="6" rx="3" transform="rotate(-8 240 163)" fill="#1E293B"/>
    <rect x="306" y="120" width="26" height="6" rx="3" transform="rotate(-8 240 163)" fill="#1E293B"/>
    <rect x="148" y="206" width="38" height="8" rx="4" transform="rotate(-8 240 163)" fill="#1E293B"/>
    <rect x="294" y="206" width="38" height="8" rx="4" transform="rotate(-8 240 163)" fill="#1E293B"/>
