<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" fill="none">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#EEF2FF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </radialGradient>
    <linearGradient id="shoe" x1="100" y1="110" x2="380" y2="250" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="480" height="360" rx="20" fill="url(#bg)"/>
  <ellipse cx="240" cy="286" rx="150" ry="14" fill="#64748B" opacity="0.25"/>
  <g filter="url(#shadow)">
    <!-- Upper Sneaker -->
    <path d="M104 230 L122 144 C140 162, 174 166, 198 140 L248 164 C282 182, 344 188, 378 214 L380 238 L104 238 Z" fill="url(#shoe)"/>
    <!-- Midsole -->
    <path d="M98 238 L384 238 C392 248, 386 266, 368 266 L108 266 C94 266, 92 250, 98 238 Z" fill="#FFFFFF"/>
    <!-- Outsole Accent -->
    <rect x="104" y="262" width="268" height="7" rx="3.5" fill="#0F172A"/>
    <!-- Side Stripe & Laces -->
    <path d="M174 214 L268 186" stroke="#38BDF8" stroke-width="8" stroke-linecap="round"/>
    <line x1="224" y1="156" x2="242" y2="148" stroke="#E2E8F0" stroke-width="4" stroke-linecap="round"/>
    <line x1="240" y1="166" x2="258" y2="158" stroke="#E2E8F0" stroke-width="4" stroke-linecap="round"/>
    <line x1="256" y1="176" x2="274" y2="168" stroke="#E2E8F0" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
