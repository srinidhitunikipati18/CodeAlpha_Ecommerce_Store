    <line x1="240" y1="108" x2="240" y2="294" stroke="#1E40AF" stroke-width="4"/>
    <circle cx="240" cy="140" r="4" fill="#E2E8F0"/>
    <circle cx="240" cy="182" r="4" fill="#E2E8F0"/>
    <circle cx="240" cy="224" r="4" fill="#E2E8F0"/>
