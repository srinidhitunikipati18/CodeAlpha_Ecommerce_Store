      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </radialGradient>
    <linearGradient id="shirt" x1="140" y1="70" x2="340" y2="290" gradientUnits="userSpaceOnUse">
