<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" fill="none">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#ECFDF5"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </radialGradient>
    <linearGradient id="weight" x1="100" y1="120" x2="380" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="480" height="360" rx="20" fill="url(#bg)"/>
  <ellipse cx="240" cy="276" rx="150" ry="14" fill="#64748B" opacity="0.24"/>
  <g filter="url(#shadow)">
    <!-- Dumbbell Bar -->
    <rect x="130" y="168" width="220" height="24" rx="8" fill="#94A3B8"/>
    <!-- Left Plates -->
    <rect x="86" y="124" width="32" height="112" rx="10" fill="url(#weight)"/>
    <rect x="122" y="106" width="38" height="148" rx="12" fill="#0F172A"/>
    <!-- Right Plates -->
    <rect x="362" y="124" width="32" height="112" rx="10" fill="url(#weight)"/>
    <rect x="320" y="106" width="38" height="148" rx="12" fill="#0F172A"/>
    <!-- Knurled Grip -->
    <rect x="190" y="166" width="100" height="28" rx="6" fill="#334155"/>
  </g>
</svg>
