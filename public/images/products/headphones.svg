<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" fill="none">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#EEF2FF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </radialGradient>
    <linearGradient id="band" x1="120" y1="60" x2="360" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="cup" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="480" height="360" rx="20" fill="url(#bg)"/>
  <ellipse cx="240" cy="306" rx="108" ry="16" fill="#94A3B8" opacity="0.28"/>
  <g filter="url(#shadow)">
    <!-- Headband -->
    <path d="M136 195 C136 96, 344 96, 344 195" stroke="url(#band)" stroke-width="22" stroke-linecap="round"/>
    <path d="M148 182 C148 106, 332 106, 332 182" stroke="#475569" stroke-width="5" stroke-linecap="round" opacity="0.5"/>
    <!-- Cushion under band -->
    <path d="M185 112 C215 99, 265 99, 295 112" stroke="#0F172A" stroke-width="10" stroke-linecap="round"/>
    <!-- Left Yoke -->
    <rect x="128" y="182" width="14" height="38" rx="7" fill="#64748B"/>
    <!-- Right Yoke -->
    <rect x="338" y="182" width="14" height="38" rx="7" fill="#64748B"/>
    <!-- Left Earcup -->
    <rect x="114" y="196" width="46" height="84" rx="22" fill="#0F172A"/>
    <rect x="104" y="204" width="38" height="68" rx="18" fill="url(#cup)"/>
    <circle cx="123" cy="238" r="10" fill="#818CF8" opacity="0.35"/>
    <circle cx="123" cy="238" r="4" fill="#A5B4FC"/>
    <!-- Right Earcup -->
    <rect x="320" y="196" width="46" height="84" rx="22" fill="#0F172A"/>
    <rect x="338" y="204" width="38" height="68" rx="18" fill="url(#cup)"/>
    <circle cx="357" cy="238" r="10" fill="#818CF8" opacity="0.35"/>
    <circle cx="357" cy="238" r="4" fill="#A5B4FC"/>
  </g>
</svg>
