<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" fill="none">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </radialGradient>
    <linearGradient id="screen" x1="100" y1="68" x2="380" y2="232" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="45%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="55%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="480" height="360" rx="20" fill="url(#bg)"/>
  <ellipse cx="240" cy="306" rx="115" ry="12" fill="#64748B" opacity="0.25"/>
  <g filter="url(#shadow)">
    <!-- Stand Neck & Base -->
    <path d="M224 238 L256 238 L262 292 L218 292 Z" fill="#94A3B8"/>
    <rect x="172" y="288" width="136" height="12" rx="6" fill="#475569"/>
    <!-- Bezel -->
    <rect x="86" y="62" width="308" height="184" rx="14" fill="#0F172A"/>
    <!-- Display -->
    <rect x="94" y="70" width="292" height="162" rx="8" fill="url(#screen)"/>
    <!-- Abstract 4K Wallpaper Wave -->
    <path d="M94 185 C160 130, 230 215, 310 135 C340 105, 368 118, 386 142 L386 232 L94 232 Z" fill="url(#accent)" opacity="0.72"/>
    <circle cx="332" cy="110" r="22" fill="#38BDF8" opacity="0.45"/>
    <!-- UI Cards on Screen -->
    <rect x="118" y="92" width="110" height="62" rx="8" fill="#FFFFFF" fill-opacity="0.14" stroke="#FFFFFF" stroke-opacity="0.22"/>
    <rect x="130" y="106" width="54" height="8" rx="4" fill="#E2E8F0" opacity="0.8"/>
    <rect x="130" y="122" width="84" height="6" rx="3" fill="#94A3B8" opacity="0.7"/>
    <rect x="130" y="134" width="68" height="6" rx="3" fill="#94A3B8" opacity="0.5"/>
    <!-- Chin badge -->
    <circle cx="240" cy="239" r="3" fill="#64748B"/>
  </g>
</svg>
