<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" fill="none">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#EEF2FF"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </radialGradient>
    <linearGradient id="screen" x1="170" y1="50" x2="310" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="50%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="480" height="360" rx="20" fill="url(#bg)"/>
  <ellipse cx="240" cy="320" rx="75" ry="12" fill="#64748B" opacity="0.26"/>
  <g filter="url(#shadow)">
    <rect x="164" y="42" width="152" height="272" rx="28" fill="#0F172A"/>
    <rect x="172" y="50" width="136" height="256" rx="22" fill="url(#screen)"/>
    <!-- Dynamic Island / Notch -->
    <rect x="216" y="58" width="48" height="12" rx="6" fill="#020617"/>
    <!-- Wallpaper Glow -->
    <circle cx="240" cy="158" r="46" fill="#FFFFFF" opacity="0.16"/>
    <circle cx="264" cy="192" r="32" fill="#38BDF8" opacity="0.25"/>
    <!-- Time & Widgets -->
    <text x="240" y="114" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="26" font-weight="700">09:41</text>
    <rect x="188" y="236" width="104" height="44" rx="12" fill="#FFFFFF" fill-opacity="0.18"/>
    <rect x="200" y="248" width="52" height="7" rx="3.5" fill="#FFFFFF" opacity="0.85"/>
    <rect x="200" y="262" width="76" height="6" rx="3" fill="#E2E8F0" opacity="0.7"/>
    <!-- Side Button -->
    <rect x="316" y="116" width="4" height="38" rx="2" fill="#475569"/>
  </g>
</svg>
