<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" fill="none">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#FDF4FF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </radialGradient>
    <linearGradient id="serum" x1="180" y1="90" x2="300" y2="290" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="480" height="360" rx="20" fill="url(#bg)"/>
  <ellipse cx="240" cy="306" rx="95" ry="13" fill="#64748B" opacity="0.22"/>
  <g filter="url(#shadow)">
    <!-- Dropper Cap -->
    <rect x="224" y="48" width="32" height="38" rx="14" fill="#1E293B"/>
    <rect x="210" y="78" width="60" height="22" rx="6" fill="#D97706"/>
    <!-- Amber Glass Bottle -->
    <rect x="180" y="102" width="120" height="190" rx="24" fill="url(#serum)"/>
    <!-- Label -->
    <rect x="194" y="150" width="92" height="96" rx="10" fill="#FFFBEB"/>
    <text x="240" y="190" text-anchor="middle" fill="#92400E" font-family="system-ui, sans-serif" font-size="13" font-weight="800">VITAMIN C</text>
    <text x="240" y="210" text-anchor="middle" fill="#B45309" font-family="system-ui, sans-serif" font-size="11" font-weight="600">GLOW SERUM</text>
    <rect x="214" y="222" width="52" height="4" rx="2" fill="#F59E0B"/>
  </g>
</svg>
