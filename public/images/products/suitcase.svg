<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" fill="none">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#EEF2FF"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </radialGradient>
    <linearGradient id="case" x1="150" y1="80" x2="330" y2="290" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.24"/>
    </filter>
  </defs>
  <rect width="480" height="360" rx="20" fill="url(#bg)"/>
  <ellipse cx="240" cy="316" rx="95" ry="12" fill="#64748B" opacity="0.26"/>
  <g filter="url(#shadow)">
    <!-- Telescoping Handle -->
    <path d="M210 92 L210 46 L270 46 L270 92" stroke="#94A3B8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="202" y="42" width="76" height="14" rx="7" fill="#0F172A"/>
    <!-- Spinner Wheels -->
    <circle cx="182" cy="296" r="14" fill="#0F172A"/>
    <circle cx="182" cy="296" r="6" fill="#64748B"/>
    <circle cx="298" cy="296" r="14" fill="#0F172A"/>
    <circle cx="298" cy="296" r="6" fill="#64748B"/>
    <!-- Hardshell Body -->
    <rect x="160" y="90" width="160" height="198" rx="26" fill="url(#case)"/>
    <!-- Vertical Ribs -->
    <rect x="186" y="112" width="10" height="154" rx="5" fill="#0F172A" opacity="0.35"/>
    <rect x="212" y="112" width="10" height="154" rx="5" fill="#0F172A" opacity="0.35"/>
    <rect x="238" y="112" width="10" height="154" rx="5" fill="#0F172A" opacity="0.35"/>
    <rect x="264" y="112" width="10" height="154" rx="5" fill="#0F172A" opacity="0.35"/>
    <rect x="290" y="112" width="10" height="154" rx="5" fill="#0F172A" opacity="0.35"/>
    <!-- Corner Guards -->
    <path d="M160 116 C160 98, 174 90, 190 90" stroke="#94A3B8" stroke-width="5" stroke-linecap="round"/>
    <path d="M320 116 C320 98, 306 90, 290 90" stroke="#94A3B8" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
