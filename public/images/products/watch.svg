<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" fill="none">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </radialGradient>
    <linearGradient id="strap" x1="200" y1="30" x2="280" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#78350F"/>
      <stop offset="100%" stop-color="#451A03"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="480" height="360" rx="20" fill="url(#bg)"/>
  <ellipse cx="240" cy="314" rx="70" ry="12" fill="#64748B" opacity="0.26"/>
  <g filter="url(#shadow)">
    <!-- Calfskin Leather Straps -->
    <rect x="206" y="42" width="68" height="86" rx="10" fill="url(#strap)"/>
    <rect x="206" y="232" width="68" height="78" rx="10" fill="url(#strap)"/>
    <!-- Titanium Bezel -->
    <circle cx="240" cy="180" r="76" fill="#94A3B8"/>
    <circle cx="240" cy="180" r="68" fill="#0F172A"/>
    <!-- Crown -->
    <rect x="315" y="170" width="12" height="20" rx="4" fill="#CBD5E1"/>
    <!-- Hour Markers -->
    <line x1="240" y1="120" x2="240" y2="132" stroke="#F8FAFC" stroke-width="3" stroke-linecap="round"/>
    <line x1="240" y1="228" x2="240" y2="240" stroke="#F8FAFC" stroke-width="3" stroke-linecap="round"/>
    <line x1="180" y1="180" x2="192" y2="180" stroke="#F8FAFC" stroke-width="3" stroke-linecap="round"/>
    <line x1="288" y1="180" x2="300" y2="180" stroke="#F8FAFC" stroke-width="3" stroke-linecap="round"/>
    <!-- Hands -->
    <line x1="240" y1="180" x2="210" y2="150" stroke="#F8FAFC" stroke-width="5" stroke-linecap="round"/>
    <line x1="240" y1="180" x2="278" y2="146" stroke="#E2E8F0" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="240" y1="180" x2="258" y2="218" stroke="#6366F1" stroke-width="2" stroke-linecap="round"/>
    <circle cx="240" cy="180" r="5" fill="#F8FAFC"/>
  </g>
</svg>
