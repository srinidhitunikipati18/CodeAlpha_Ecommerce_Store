<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" fill="none">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#EEF2FF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </radialGradient>
    <linearGradient id="strap" x1="200" y1="40" x2="280" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="480" height="360" rx="20" fill="url(#bg)"/>
  <ellipse cx="240" cy="312" rx="75" ry="12" fill="#64748B" opacity="0.25"/>
  <g filter="url(#shadow)">
    <!-- Top & Bottom Straps -->
    <rect x="198" y="42" width="84" height="90" rx="16" fill="url(#strap)"/>
    <rect x="198" y="228" width="84" height="82" rx="16" fill="url(#strap)"/>
    <!-- Titanium Watch Case -->
    <rect x="172" y="106" width="136" height="148" rx="34" fill="#94A3B8"/>
    <rect x="177" y="111" width="126" height="138" rx="30" fill="#0F172A"/>
    <!-- Crown -->
    <rect x="308" y="156" width="10" height="28" rx="4" fill="#64748B"/>
    <!-- AMOLED Dial -->
    <circle cx="240" cy="180" r="52" fill="#020617"/>
    <circle cx="240" cy="180" r="46" stroke="#1E293B" stroke-width="5"/>
    <!-- Activity Rings -->
    <circle cx="240" cy="180" r="44" stroke="#6366F1" stroke-width="5" stroke-dasharray="220 276" stroke-linecap="round"/>
    <circle cx="240" cy="180" r="35" stroke="#22D3EE" stroke-width="4" stroke-dasharray="165 220" stroke-linecap="round"/>
    <!-- Digital Time -->
    <text x="240" y="177" text-anchor="middle" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="22" font-weight="700">10:09</text>
    <text x="240" y="197" text-anchor="middle" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">72 BPM</text>
  </g>
</svg>
