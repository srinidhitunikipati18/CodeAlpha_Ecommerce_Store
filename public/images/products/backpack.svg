<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" fill="none">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#F5F5F4"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </radialGradient>
    <linearGradient id="leather" x1="150" y1="80" x2="330" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#44403C"/>
      <stop offset="100%" stop-color="#1C1917"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="14" flood-color="#1C1917" flood-opacity="0.24"/>
    </filter>
  </defs>
  <rect width="480" height="360" rx="20" fill="url(#bg)"/>
  <ellipse cx="240" cy="310" rx="100" ry="14" fill="#78716C" opacity="0.25"/>
  <g filter="url(#shadow)">
    <!-- Top Handle -->
    <path d="M210 86 C210 58, 270 58, 270 86" stroke="#292524" stroke-width="12" stroke-linecap="round"/>
    <!-- Main Pack Body -->
    <rect x="148" y="82" width="184" height="218" rx="42" fill="url(#leather)"/>
    <!-- Subtle Seam -->
    <rect x="160" y="94" width="160" height="194" rx="34" stroke="#57534E" stroke-width="1.5" stroke-dasharray="6 4"/>
    <!-- Front Pocket -->
    <rect x="168" y="182" width="144" height="96" rx="20" fill="#292524"/>
    <line x1="176" y1="194" x2="304" y2="194" stroke="#A8A29E" stroke-width="3" stroke-linecap="round"/>
    <!-- Brass Buckle Accent -->
    <rect x="228" y="188" width="24" height="12" rx="3" fill="#D97706"/>
    <!-- Brand Tag -->
    <rect x="218" y="128" width="44" height="18" rx="4" fill="#1C1917" stroke="#78716C" stroke-width="1"/>
  </g>
</svg>
