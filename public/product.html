<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Details — CodeAlpha Store</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <div id="site-header-root"></div>

    <main class="section">
      <div class="container">
        <div id="product-detail-root">
          <div class="loading-state">
            <div class="spinner"></div>
            <span>Loading product details...</span>
          </div>
        </div>

        <section id="related-section" style="margin-top: 64px; display: none;">
          <div class="section-header">
            <div>
              <span class="section-eyebrow">You May Also Like</span>
              <h2 class="section-title">Related Products</h2>
            </div>
            <a href="/shop" class="btn btn-secondary btn-sm">Browse All</a>
          </div>
          <div id="related-products-grid" class="product-grid"></div>
        </section>
      </div>
    </main>

    <div id="site-footer-root"></div>

    <script src="/js/api.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/product.js"></script>
  </body>
</html>
